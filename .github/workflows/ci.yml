name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *' # nightly: the public API can change

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Dependency audit (fails on critical or worse)
        run: npm audit --audit-level=critical
      - run: npm run lint:spec
      - name: Every relative link in the documents works
        run: node tools/check-links.js
      - run: npm test
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: api-reports
          path: reports

  # Publishes the reports as a small website: https://jahidulislamrihan26.github.io/api-testing-newman-openapi/
  pages:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: api-reports
          path: site
      - run: cp .github/pages/index.html site/index.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5
